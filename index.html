<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Island Hawaii · June 2–14, 2026</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hawaii 2026">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: transparent;
  --surface: rgba(255,255,255,0.80);
  --surface2: rgba(255,255,255,0.65);
  --border: rgba(255,255,255,0.55);
  --text: #12344d;
  --text-muted: rgba(18,52,77,0.65);
  --text-muted2: rgba(18,52,77,0.42);
  --accent: #d4007a;
  --accent-dim: rgba(212,0,122,0.10);
  --green: #00896b;
  --green-dim: rgba(0,137,107,0.12);
  --blue: #0077b6;
  --blue-dim: rgba(0,119,182,0.12);
  --orange: #e05c00;
  --orange-dim: rgba(224,92,0,0.12);
  --red: #c0392b;
  --red-dim: rgba(192,57,43,0.12);
  --purple: #7b2d8b;
  --purple-dim: rgba(123,45,139,0.12);
  --cyan: #0096c7;
  --cyan-dim: rgba(0,150,199,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: linear-gradient(160deg,rgba(0,170,210,0.20) 0%,rgba(0,50,110,0.25) 100%), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&q=80') center/cover fixed no-repeat;
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.container { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }

/* Header */
.header { text-align: center; padding: 40px 0 30px; }
.header-label { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.header h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 36px; font-weight: 700; margin-bottom: 6px; }
.header-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; }

/* Stats Bar */
.stats-bar {
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  padding: 16px; background: rgba(255,255,255,0.93); border-radius: 12px;
  border: 1px solid var(--border); margin-bottom: 30px;
}
.stat { text-align: center; min-width: 80px; }
.stat-value { font-size: 22px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted2); }

/* Legend */
.legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* Day Cards */
.day-card {
  border: 1px solid rgba(255,255,255,0.75); border-radius: 14px;
  margin-bottom: 8px; overflow: hidden; transition: all 0.2s ease;
  background: rgba(255,255,255,0.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 4px 20px rgba(0,100,160,0.12);
}
.day-card.open { background: rgba(20,24,36,0.72); border-color: rgba(255,255,255,0.12); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.day-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; cursor: pointer; user-select: none;
  background: none; border: none; width: 100%;
  color: var(--text); font-family: inherit; text-align: left;
}
.day-header:hover { background: rgba(212,0,122,0.06); }
.day-icon { font-size: 24px; line-height: 1; }
.day-info { flex: 1; min-width: 0; }
.day-meta { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted2); }
.day-title { font-size: 16px; font-weight: 600; margin-top: 2px; }
.day-badge {
  font-size: 10px; padding: 3px 10px; border-radius: 20px;
  background: rgba(255,255,255,0.06); color: var(--text-muted);
  white-space: nowrap;
}
.day-progress {
  width: 40px; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,0.06); overflow: hidden;
}
.day-progress-fill { height: 100%; background: linear-gradient(90deg,#00b4d8,#d4007a); border-radius: 2px; transition: width 0.3s; }
.day-arrow { font-size: 16px; color: var(--text-muted2); transition: transform 0.2s; }
.day-card.open .day-arrow { transform: rotate(180deg); }

/* Day Content */
.day-content { padding: 0 16px 16px; }
.day-divider { border-top: 1px solid var(--border); margin-bottom: 14px; }

/* Activity Items */
.activity-item {
  display: flex; gap: 10px; padding: 10px 12px;
  border-radius: 10px; margin-bottom: 6px;
  align-items: flex-start; position: relative;
  transition: opacity 0.2s;
}
.activity-item.done { opacity: 0.5; }
.activity-item.done .activity-label { text-decoration: line-through; }
.activity-check {
  width: 20px; height: 20px; border-radius: 5px; border: 2px solid rgba(255,255,255,0.2);
  background: none; cursor: pointer; flex-shrink: 0; margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: transparent; transition: all 0.15s;
}
.activity-check.checked { background: var(--green); border-color: var(--green); color: #fff; }
.activity-time {
  min-width: 65px; font-size: 11px; font-weight: 700;
  padding-top: 3px; letter-spacing: 0.3px;
}
.activity-label { font-size: 13px; line-height: 1.5; flex: 1; }
.activity-remove {
  background: none; border: none; color: var(--text-muted2);
  cursor: pointer; font-size: 16px; padding: 0 4px; opacity: 0;
  transition: opacity 0.15s;
}
.activity-item:hover .activity-remove { opacity: 1; }

/* Type Colors */
.type-activity { background: var(--green-dim); }
.type-activity .activity-time { color: var(--green); }
.type-activity .activity-label { color: #78d890; }
.type-food { background: var(--orange-dim); }
.type-food .activity-time { color: var(--orange); }
.type-food .activity-label { color: #e8b868; }
.type-beach { background: var(--cyan-dim); }
.type-beach .activity-time { color: var(--cyan); }
.type-beach .activity-label { color: #70e0f8; }
.type-transport { background: rgba(140,160,190,0.1); }
.type-transport .activity-time { color: #90a8c0; }
.type-transport .activity-label { color: #b0c4d8; }
.type-hotel { background: var(--purple-dim); }
.type-hotel .activity-time { color: var(--purple); }
.type-hotel .activity-label { color: #c8b0e8; }

/* Add Activity */
.add-activity-row {
  display: flex; gap: 6px; margin-top: 10px;
}
.add-input {
  flex: 1; padding: 8px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: rgba(255,255,255,0.65);
  color: var(--text); font-family: inherit; font-size: 13px;
}
.add-input::placeholder { color: var(--text-muted2); }
.add-input:focus { outline: none; border-color: var(--accent); }
.add-select {
  padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: rgba(255,255,255,0.65);
  color: var(--text); font-family: inherit; font-size: 12px;
}
.add-select:focus { outline: none; border-color: var(--accent); }
.add-time-input {
  width: 80px; padding: 8px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: rgba(255,255,255,0.65);
  color: var(--text); font-family: inherit; font-size: 12px;
}
.add-btn {
  padding: 8px 14px; border-radius: 8px; border: none;
  background: var(--accent); color: #000; font-weight: 600;
  cursor: pointer; font-size: 13px; white-space: nowrap;
}
.add-btn:hover { background: #f5d060; }

/* Tip Box */
.tip-box {
  margin-top: 14px; padding: 12px 14px;
  background: var(--accent-dim); border-radius: 10px;
  border-left: 3px solid var(--accent);
}
.tip-title { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.tip-text { font-size: 12px; line-height: 1.6; color: rgba(255,255,255,0.65); }

/* Day Notes */
.day-notes {
  margin-top: 10px;
}
.notes-textarea {
  width: 100%; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: rgba(255,255,255,0.65);
  color: var(--text); font-family: inherit; font-size: 12px;
  resize: vertical; min-height: 50px; line-height: 1.5;
}
.notes-textarea::placeholder { color: var(--text-muted2); }
.notes-textarea:focus { outline: none; border-color: var(--accent); }

/* Cash Estimate */
.cash-estimate {
  margin-top: 8px; font-size: 11px; color: var(--text-muted2);
  text-align: right;
}

/* Footer */
.footer {
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  margin-top: 30px; padding: 20px; border-radius: 12px;
  background: rgba(255,255,255,0.93); border: 1px solid var(--border);
  text-align: center;
}
.footer-total-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
.footer-total { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 700; }
.footer-sub { font-size: 12px; color: var(--text-muted2); margin-top: 4px; }

/* Booking Checklist */
.booking-section {
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  margin-top: 20px; padding: 20px; border-radius: 12px;
  background: rgba(255,255,255,0.93); border: 1px solid var(--border);
}
.booking-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.booking-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid var(--border); font-size: 13px;
}
.booking-item:last-child { border-bottom: none; }
.booking-status {
  padding: 3px 10px; border-radius: 20px; font-size: 10px;
  font-weight: 600; cursor: pointer; user-select: none;
  letter-spacing: 0.5px;
}
.status-pending { background: var(--red-dim); color: var(--red); }
.status-booked { background: var(--green-dim); color: var(--green); }
.booking-name { flex: 1; }

/* Reset Button */
.reset-section { text-align: center; margin-top: 20px; }
.reset-btn {
  padding: 8px 20px; border-radius: 8px; border: 1px solid var(--border);
  background: none; color: var(--text-muted); cursor: pointer;
  font-size: 12px; font-family: inherit;
}
.reset-btn:hover { border-color: var(--red); color: var(--red); }

@media (max-width: 600px) {
  .header h1 { font-size: 28px; }
  .stats-bar { gap: 8px; padding: 12px; }
  .stat-value { font-size: 18px; }
  .add-activity-row { flex-wrap: wrap; }
  .add-time-input { width: 100%; }
  .add-select { width: 100%; }
  .activity-remove { opacity: 1; }
}

/* ══ DUAL CLOCK ══════════════════════════════════════════════════════════════ */
.clock-section {
  position:relative; overflow:hidden;
  margin-bottom:20px; padding:22px 24px 16px;
  border-radius:16px; border:none;
  box-shadow:0 8px 32px rgba(0,0,0,0.22);
  display:flex; flex-direction:column; align-items:center; gap:0;
  transition:background 2s;
}
.clock-bg { position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.clock-inner { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; width:100%; }
.clock-vibe { position:relative; z-index:1; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; opacity:0.70; margin-top:10px; }
.clock-divider { width:1px; height:64px; margin:0 28px; transition:background 1s; }
.clock-unit { text-align:center; }
.clock-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; transition:color 1s; }
.clock-time { font-family:'Courier New','Lucida Console',monospace; font-weight:700; letter-spacing:2px; transition:color 1s, text-shadow 1s; }
.clock-time.hawaii { font-size:34px; }
.clock-time.florida { font-size:24px; }
.clock-date { font-size:11px; margin-top:5px; transition:color 1s; }

/* Clock animated elements */
.cstar { position:absolute; border-radius:50%; background:#fff; animation:twinkle ease-in-out infinite; }
@keyframes twinkle{0%,100%{opacity:0.15;transform:scale(1);}50%{opacity:1;transform:scale(1.5);}}
.csun { position:absolute; border-radius:50%; animation:cSunPulse ease-in-out infinite; }
@keyframes cSunPulse{0%,100%{opacity:0.7;transform:scale(1);}50%{opacity:1;transform:scale(1.15);}}
.ccloud { position:absolute; border-radius:50%; animation:cCloudDrift linear infinite; }
@keyframes cCloudDrift{0%{transform:translateX(-120px);}100%{transform:translateX(120vw);}}
.chorizon { position:absolute; bottom:0; left:0; right:0; height:40%; pointer-events:none; }

/* ─ DAWN (5–7am) ─ */
.cs-dawn { background:linear-gradient(160deg,#1a0533 0%,#7b2660 35%,#d45c3a 70%,#ffc97a 100%); }
.cs-dawn .clock-time.hawaii { color:#ffc97a; text-shadow:0 0 20px rgba(255,150,50,0.7); }
.cs-dawn .clock-time.florida { color:rgba(255,190,130,0.75); }
.cs-dawn .clock-label,.cs-dawn .clock-date,.cs-dawn .clock-vibe { color:rgba(255,190,130,0.70); }
.cs-dawn .clock-divider { background:rgba(255,190,130,0.30); }

/* ─ MORNING (7am–12pm) ─ */
.cs-morning { background:linear-gradient(160deg,#1a6dbf 0%,#3aaef0 50%,#7ad4f8 100%); }
.cs-morning .clock-time.hawaii { color:#fff; text-shadow:0 0 22px rgba(255,240,80,0.65); }
.cs-morning .clock-time.florida { color:rgba(255,255,255,0.72); }
.cs-morning .clock-label,.cs-morning .clock-date,.cs-morning .clock-vibe { color:rgba(255,255,255,0.68); }
.cs-morning .clock-divider { background:rgba(255,255,255,0.28); }

/* ─ MIDDAY (12–3pm) ─ */
.cs-midday { background:linear-gradient(160deg,#00b4e8 0%,#29d9ff 40%,#9aeeff 100%); }
.cs-midday .clock-time.hawaii { color:#003d55; text-shadow:0 0 20px rgba(255,245,100,0.55); }
.cs-midday .clock-time.florida { color:rgba(0,60,90,0.72); }
.cs-midday .clock-label,.cs-midday .clock-date,.cs-midday .clock-vibe { color:rgba(0,60,90,0.60); }
.cs-midday .clock-divider { background:rgba(0,60,90,0.18); }

/* ─ AFTERNOON (3–6pm) ─ */
.cs-afternoon { background:linear-gradient(160deg,#f9d423 0%,#f5a020 55%,#e07000 100%); }
.cs-afternoon .clock-time.hawaii { color:#5a2800; text-shadow:0 0 16px rgba(255,200,0,0.50); }
.cs-afternoon .clock-time.florida { color:rgba(80,35,0,0.72); }
.cs-afternoon .clock-label,.cs-afternoon .clock-date,.cs-afternoon .clock-vibe { color:rgba(80,35,0,0.62); }
.cs-afternoon .clock-divider { background:rgba(80,35,0,0.22); }

/* ─ SUNSET (6–8pm) ─ */
.cs-sunset { background:linear-gradient(160deg,#0d0a2e 0%,#8b1a5a 25%,#e84040 55%,#f5a020 80%,#ffd060 100%); }
.cs-sunset .clock-time.hawaii { color:#ffd060; text-shadow:0 0 22px rgba(255,140,0,0.70); }
.cs-sunset .clock-time.florida { color:rgba(255,195,100,0.75); }
.cs-sunset .clock-label,.cs-sunset .clock-date,.cs-sunset .clock-vibe { color:rgba(255,195,100,0.65); }
.cs-sunset .clock-divider { background:rgba(255,195,100,0.30); }

/* ─ DUSK (8–10pm) ─ */
.cs-dusk { background:linear-gradient(160deg,#070310 0%,#180d40 50%,#2e1060 100%); }
.cs-dusk .clock-time.hawaii { color:#c8a8ff; text-shadow:0 0 18px rgba(180,100,255,0.55); }
.cs-dusk .clock-time.florida { color:rgba(180,150,255,0.68); }
.cs-dusk .clock-label,.cs-dusk .clock-date,.cs-dusk .clock-vibe { color:rgba(180,150,255,0.55); }
.cs-dusk .clock-divider { background:rgba(180,150,255,0.22); }

/* ─ NIGHT (10pm–5am) ─ */
.cs-night { background:linear-gradient(160deg,#020406 0%,#040c18 55%,#071428 100%); }
.cs-night .clock-time.hawaii { color:#80c8ff; text-shadow:0 0 18px rgba(80,160,255,0.55); }
.cs-night .clock-time.florida { color:rgba(120,170,255,0.65); }
.cs-night .clock-label,.cs-night .clock-date,.cs-night .clock-vibe { color:rgba(120,170,255,0.50); }
.cs-night .clock-divider { background:rgba(120,170,255,0.18); }

@media(max-width:600px){
  .clock-time.hawaii{font-size:26px;} .clock-time.florida{font-size:20px;}
  .clock-divider{margin:0 16px;}
}

/* Time Reference Strip */
.time-ref-wrap {
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  margin-bottom: 20px; padding: 14px 18px;
  background: rgba(255,255,255,0.97); border-radius: 12px;
  border: 1px solid var(--border); box-shadow: 0 2px 16px rgba(0,80,140,0.10);
}
.time-ref-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.time-ref-title { font-size: 12px; font-weight: 700; color: #0a1e2e; letter-spacing: 0.3px; }
.time-ref-diff { font-size: 10px; color: rgba(10,30,46,0.50); font-style: italic; }
.time-ref-cols { display: flex; gap: 0; }
.time-ref-col { flex: 1; }
.time-ref-col-label {
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  font-weight: 700; padding: 4px 8px 6px; text-align: center;
  border-bottom: 1px solid rgba(10,30,46,0.08);
}
.time-ref-col-label.fl { color: #0055a0; background: rgba(0,85,160,0.06); border-radius: 6px 0 0 0; }
.time-ref-col-label.hi { color: #c0006b; background: rgba(192,0,107,0.06); border-radius: 0 6px 0 0; }
.time-ref-row { display: flex; }
.time-ref-cell {
  flex: 1; padding: 5px 8px; text-align: center;
  font-size: 12px; font-weight: 600; color: rgba(10,30,46,0.70);
  border-bottom: 1px solid rgba(10,30,46,0.05);
  transition: background 0.2s;
}
.time-ref-cell.fl { border-right: 1px solid rgba(10,30,46,0.08); }
.time-ref-row.now .time-ref-cell {
  background: linear-gradient(90deg, rgba(0,85,160,0.12) 0%, rgba(192,0,107,0.12) 100%);
  color: #0a1e2e; font-weight: 800;
}
.time-ref-row.now .time-ref-cell.fl { color: #0055a0; }
.time-ref-row.now .time-ref-cell.hi { color: #c0006b; }
.time-ref-arrow { width: 28px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: rgba(10,30,46,0.25); border-bottom: 1px solid rgba(10,30,46,0.05); }
.time-ref-now-badge {
  display: inline-block; font-size: 8px; letter-spacing: 1px;
  background: #d4007a; color: #fff; padding: 1px 5px;
  border-radius: 4px; margin-left: 5px; vertical-align: middle;
  font-weight: 700; text-transform: uppercase;
}
@media (max-width: 600px) {
  .time-ref-cell { font-size: 11px; padding: 5px 4px; }
  .time-ref-arrow { width: 18px; }
}
.countdown-section {
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  margin-bottom: 20px; padding: 22px 24px;
  background: rgba(255,255,255,0.93); border-radius: 12px;
  border: 1px solid var(--border); text-align: center;
}
.countdown-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.countdown-time {
  font-family: 'Courier New', 'Lucida Console', monospace;
  font-size: 30px; font-weight: 700; color: var(--accent); letter-spacing: 3px;
}
.countdown-sub { font-size: 12px; color: var(--text-muted2); margin-top: 8px; }
@media (max-width: 600px) {
  .clock-time.hawaii { font-size: 26px; }
  .clock-time.florida { font-size: 20px; }
  .clock-divider { margin: 0 16px; }
  .countdown-time { font-size: 22px; }
}

/* Volcano Status */
.volcano-section {
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  margin-bottom: 20px; padding: 16px; border-radius: 12px;
  background: rgba(255,255,255,0.93); border: 1px solid var(--border);
}
.volcano-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.volcano-link {
  display: inline-block; padding: 8px 16px; border-radius: 8px;
  background: var(--red-dim); color: var(--red); text-decoration: none;
  font-size: 12px; font-weight: 600; margin-top: 8px;
  transition: background 0.15s;
}

/* ── Sound Toggle ── */
.sound-toggle {

/* ══ WEATHER SKINS ══════════════════════════════════════════════════════════════ */
.weather-section {
  position:relative; overflow:hidden;

}
.wbg { position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }

.weather-current { display:flex; align-items:center; gap:10px; }

.weather-day-card { text-align:center; padding:10px 14px; border-radius:12px; min-width:68px; }
.wday-label { font-size:9px; letter-spacing:2px; text-transform:uppercase; font-weight:700; margin-bottom:5px; }
.wday-icon { font-size:22px; line-height:1; margin-bottom:4px; }

}

function loadState() {
  try {
    const saved = localStorage.getItem('hawaii-trip-2026-v6');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  // Deep copy so toggles don't mutate DEFAULT_DAYS constants
  return JSON.parse(JSON.stringify({ days: DEFAULT_DAYS, bookings: DEFAULT_BOOKINGS, openDay: 0 }));
}

function saveState(state) {
  try { localStorage.setItem('hawaii-trip-2026-v6', JSON.stringify(state)); } catch(e) {}
}

let state = loadState();

function getStats() {
  let total = 0, done = 0;
  state.days.forEach(d => { d.items.forEach(i => { total++; if (i.done) done++; }); });
  const booked = state.bookings.filter(b => b.booked).length;
  return { total, done, booked, totalBookings: state.bookings.length };
}

const TRIP_END_MS   = Date.UTC(2026, 5, 15, 9, 59, 59); // Jun 14 2026 23:59 HST = Jun 15 09:59 UTC

function getHawaiiDate() {
  // Hawaii = UTC-10, no DST
  return new Date(Date.now() - 10 * 3600000);
}
function getFloridaDate() {
  // Florida EDT in June = UTC-4
  return new Date(Date.now() - 4 * 3600000);
}
function fmt12(d) {
  let h = d.getUTCHours(), m = d.getUTCMinutes(), s = d.getUTCSeconds();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + ' ' + ap;
}
function fmtDate(d) {
  const DS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return DS[d.getUTCDay()] + ', ' + MS[d.getUTCMonth()] + ' ' + d.getUTCDate();
}
// Florida is UTC-4 (EDT in June), Hawaii is UTC-10 (HST, no DST)
const TZ_DIFF_HOURS = 6;

// Clock skin helpers
function getClockSkin(hiHour) {
  if (hiHour >= 5  && hiHour < 7)  return 'dawn';
  if (hiHour >= 7  && hiHour < 12) return 'morning';
  if (hiHour >= 12 && hiHour < 15) return 'midday';
  if (hiHour >= 15 && hiHour < 18) return 'afternoon';
  if (hiHour >= 18 && hiHour < 20) return 'sunset';
  if (hiHour >= 20 && hiHour < 22) return 'dusk';
  return 'night';
}

            left=(Math.random()*100).toFixed(1), dur=(1.5+Math.random()*3).toFixed(1),
            del=(Math.random()*4).toFixed(1);
      return `<div class="cstar" style="width:${s}px;height:${s}px;top:${top}%;left:${left}%;animation-duration:${dur}s;animation-delay:-${del}s"></div>`;
    }).join('');
  }
  if (skin === 'dawn' || skin === 'sunset') {
    const clouds = [0,1,2].map(i => {
      const w=70+i*35, h=(w*.45).toFixed(0), top=15+i*22, dur=18+i*9;
      const col = skin==='sunset' ? 'rgba(255,120,60,0.14)' : 'rgba(255,180,120,0.13)';
      return `<div class="ccloud" style="width:${w}px;height:${h}px;top:${top}%;background:${col};border-radius:50%;animation-duration:${dur}s;animation-delay:-${i*5}s"></div>`;
    }).join('');
    const glow = `<div style="position:absolute;bottom:0;left:0;right:0;height:45%;background:linear-gradient(to top,rgba(255,${skin==='sunset'?'100':'160'},30,0.22),transparent);pointer-events:none"></div>`;
    return clouds + glow;
  }
  if (skin === 'morning') {
    const sun = `<div class="csun" style="width:80px;height:80px;top:-22px;right:36px;background:radial-gradient(circle,rgba(255,245,80,0.55) 30%,transparent 70%);animation-duration:7s"></div>`;
    const clouds = [0,1].map(i => {
      const w=80+i*45, dur=22+i*12;
      return `<div class="ccloud" style="width:${w}px;height:${(w*.48).toFixed(0)}px;top:${18+i*28}%;background:rgba(255,255,255,0.16);border-radius:50%;animation-duration:${dur}s;animation-delay:-${i*8}s"></div>`;
    }).join('');
    return sun + clouds;
  }
  if (skin === 'midday') {
    return `<div class="csun" style="width:110px;height:110px;top:-30px;right:-18px;background:radial-gradient(circle,rgba(255,255,180,0.50) 30%,transparent 70%);animation-duration:9s"></div>`;
  }
  if (skin === 'afternoon') {
    return `<div class="csun" style="width:90px;height:90px;bottom:-10px;right:24px;background:radial-gradient(circle,rgba(255,210,40,0.48) 30%,transparent 70%);animation-duration:8s"></div>`;
  }
  return '';
}

function buildTimeRefHtml() {
  const now = new Date();
  // Get current Florida hour (0-23)
  const flHour = parseInt(now.toLocaleString('en-US',{timeZone:'America/New_York',hour:'numeric',hour12:false}).replace('24','0'));
  // Rows: show every 3 hours across a 24hr day starting from midnight Florida
  const rows = [];
  for (let fh = 0; fh < 24; fh += 3) {
    let hh = fh - TZ_DIFF_HOURS;
    if (hh < 0) hh += 24;
    function fmt(h) {
      const ampm = h < 12 ? 'AM' : 'PM';
      const h12 = h === 0 ? 12 : (h > 12 ? h - 12 : h);
      return h12 + ':00 ' + ampm;
    }
    const isNow = flHour >= fh && flHour < fh + 3;
    rows.push({ fl: fmt(fh), hi: fmt(hh), isNow });
  }
  const rowsHtml = rows.map(r => `
    <div class="time-ref-row${r.isNow ? ' now' : ''}">
      <div class="time-ref-cell fl">${r.fl}${r.isNow ? '<span class="time-ref-now-badge">NOW</span>' : ''}</div>
      <div class="time-ref-arrow">→</div>
      <div class="time-ref-cell hi">${r.hi}${r.isNow ? '<span class="time-ref-now-badge">NOW</span>' : ''}</div>
    </div>`).join('');
  return `<div class="time-ref-wrap">
    <div class="time-ref-header">
      <div class="time-ref-title">🕒 Florida ↔ Kona Time Reference</div>
      <div class="time-ref-diff">Hawaii is always 6 hrs behind Florida</div>
    </div>
    <div class="time-ref-cols">
      <div class="time-ref-col">
        <div class="time-ref-col-label fl">🏠 Florida (ET)</div>
      </div>
      <div style="width:28px"></div>
      <div class="time-ref-col">
        <div class="time-ref-col-label hi">🌴 Kona (HST)</div>
      </div>
    </div>
    ${rowsHtml}
  </div>`;
}

function buildClockHtml() {
  const now = Date.now();
  if (now < TRIP_START_MS) {
    const diff = TRIP_START_MS - now;
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    return `<div class="countdown-section">
      <div class="countdown-label">🌺 Hawaii departure countdown</div>
      <div class="countdown-time" id="clock-countdown">${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s</div>
      <div class="countdown-sub">Trip starts Jun 2, 2026 — Kailua-Kona, Big Island</div>
    </div>`;
  } else if (now > TRIP_END_MS) {
    return `<div class="clock-section" style="justify-content:center;gap:12px;flex-direction:column">
      <div style="font-size:32px;text-align:center">🤙</div>
      <div style="font-size:18px;font-weight:700;text-align:center">Mahalo! Trip complete</div>
      <div style="font-size:12px;color:var(--text-muted2);text-align:center">What a trip. Big Island forever. 🌴</div>
    </div>`;
  } else {
    const hi = getHawaiiDate();
    const fl = getFloridaDate();
    const skin = getClockSkin(hi.getHours());
    const bg = genClockBg(skin);
    const vibe = CLOCK_VIBES[skin] || '';
    return `<div class="clock-section cs-${skin}" id="clock-section">
      <div class="clock-bg">${bg}</div>
      <div class="clock-inner">
        <div class="clock-unit">
          <div class="clock-label">🌴 hawaii (hst)</div>
          <div class="clock-time hawaii" id="clock-hi">${fmt12(hi)}</div>
          <div class="clock-date" id="clock-hi-date">${fmtDate(hi)}</div>
        </div>
        <div class="clock-divider"></div>
        <div class="clock-unit">
          <div class="clock-label">🏠 florida (et)</div>
          <div class="clock-time florida" id="clock-fl">${fmt12(fl)}</div>
          <div class="clock-date" id="clock-fl-date">${fmtDate(fl)}</div>
        </div>
      </div>
      <div class="clock-vibe" id="clock-vibe">${vibe}</div>
    </div>`;
  }
}

let _lastClockSkin = null;
function tickClock() {
  const now = Date.now();
  if (now >= TRIP_START_MS && now <= TRIP_END_MS) {
    const hi = getHawaiiDate(), fl = getFloridaDate();
    const ehi = document.getElementById('clock-hi');
    const efl = document.getElementById('clock-fl');
    const ehid = document.getElementById('clock-hi-date');
    const efld = document.getElementById('clock-fl-date');
    if (ehi) ehi.textContent = fmt12(hi);
    if (efl) efl.textContent = fmt12(fl);
    if (ehid) ehid.textContent = fmtDate(hi);
    if (efld) efld.textContent = fmtDate(fl);
    // Update skin if hour changed
    const newSkin = getClockSkin(hi.getHours());
    if (newSkin !== _lastClockSkin) {
      _lastClockSkin = newSkin;
      const sec = document.getElementById('clock-section');
      if (sec) {
        sec.className = 'clock-section cs-' + newSkin;
        const bg = sec.querySelector('.clock-bg');
        if (bg) bg.innerHTML = genClockBg(newSkin);
        const vib = document.getElementById('clock-vibe');
        if (vib) vib.textContent = CLOCK_VIBES[newSkin] || '';
      }
    }
  } else {
    // Countdown: update in place
    const cEl = document.getElementById('clock-countdown');
    if (cEl && now < TRIP_START_MS) {
      const diff = TRIP_START_MS - now;
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      cEl.textContent = d + 'd ' + String(h).padStart(2,'0') + 'h ' + String(m).padStart(2,'0') + 'm ' + String(s).padStart(2,'0') + 's';
    }
  }
}

// Helper: current Hawaii day index (0 = Jun 2) for activity highlighting
function getHawaiiDayIndex() {
  const hi = getHawaiiDate();
  // Trip days: Jun 2–13 (days[0]–days[11])
  const tripDayOne = Date.UTC(2026, 5, 2); // Jun 2 UTC (used as offset base)
  const hiMidnight = Date.UTC(hi.getUTCFullYear(), hi.getUTCMonth(), hi.getUTCDate());
  return Math.floor((hiMidnight - tripDayOne) / 86400000);
}

// Helper: Hawaii minutes since midnight for activity timer
function getHawaiiMinutes() {
  const hi = getHawaiiDate();
  return hi.getUTCHours() * 60 + hi.getUTCMinutes();
}

  {name:'Rooster',emoji:'🐓'},{name:'Ocean',emoji:'🌊'},
];

function parseTime(t) {
  if (!t || t==='—') return null;
  const m = t.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!m) return null;
  let h=parseInt(m[1]), mn=parseInt(m[2]);
  if (m[3].toUpperCase()==='PM'&&h!==12) h+=12;
  if (m[3].toUpperCase()==='AM'&&h===12) h=0;
  return h*60+mn;
}

function fmtCountdown(diffMin) {
  if (diffMin<=0) return 'GO NOW';
  if (diffMin<60) return diffMin+'m';
  const h=Math.floor(diffMin/60), mn=diffMin%60;
  return mn>0 ? h+'h '+mn+'m' : h+'h';
}

function getTimerState(items, idx, hiNowMin, dayIdx) {
  const item = items[idx];
  const startMin = parseTime(item.time);
  if (startMin===null) return null;
  let nextMin=null;
  for (let j=idx+1;j<items.length;j++) {
    const nm=parseTime(items[j].time);
    if (nm!==null){nextMin=nm;break;}
  }
  const travelMin = item.travelMin||0;
  const leaveByMin = startMin - travelMin;
  const minToLeave = leaveByMin - hiNowMin;
  const minToStart = startMin - hiNowMin;
  const isActive = hiNowMin>=startMin && (nextMin===null||hiNowMin<nextMin);
  const isDone = nextMin!==null ? hiNowMin>=nextMin : hiNowMin>=startMin+90;
  if (isDone) return {cls:'timer-done',label:'✓ DONE',dot:false};
  if (isActive) {
    if (nextMin!==null) {
      const leaveForItem = items.slice(idx+1).find(it=>parseTime(it.time)!==null);
      const nextTravel = leaveForItem?(leaveForItem.travelMin||0):0;
      const leaveAt = nextMin-nextTravel;
      const minLeft = leaveAt-hiNowMin;
      const key = dayIdx+'-'+idx;
      if (minLeft<=1&&!alarmFired.has(key)){alarmFired.add(key);playAnimalSound(dayIdx);}
      if (minLeft<=0) return {cls:'timer-red',label:'🚨 LEAVE NOW',dot:true};
      if (minLeft<=10) return {cls:'timer-red',label:'🔴 LEAVE IN '+minLeft+'m',dot:true};
      if (minLeft<=20) return {cls:'timer-orange',label:'🟡 LEAVE IN '+fmtCountdown(minLeft),dot:true};
      return {cls:'timer-active',label:'● ACTIVE — leave in '+fmtCountdown(minLeft),dot:true};
    }
    return {cls:'timer-active',label:'● ACTIVE NOW',dot:true};
  }
  if (travelMin>0&&minToLeave<=0&&minToStart>0) return {cls:'timer-red',label:'🚨 LEAVE NOW',dot:true};
  if (travelMin>0&&minToLeave<=10) return {cls:'timer-orange',label:'🔴 LEAVE IN '+fmtCountdown(minToLeave),dot:true};
  if (travelMin>0&&minToLeave<=25) return {cls:'timer-yellow',label:'🟡 LEAVE IN '+fmtCountdown(minToLeave),dot:true};
  if (minToStart<=20) return {cls:'timer-yellow',label:'Starts in '+fmtCountdown(minToStart),dot:true};
  if (minToStart<=60) return {cls:'timer-green',label:'Starts in '+fmtCountdown(minToStart),dot:true};
  return {cls:'timer-future',label:'@ '+item.time,dot:false};
}

    <div class="footer">
      <div class="footer-total-label">Estimated Cash Spend (Activities, Food, Transport, Airbnb)</div>
      <div class="footer-total">~$17,710+</div>
      <div style="font-size:11px;color:rgba(10,30,46,0.50);margin-top:6px">Day 1 actual: $380 Costco · $490 Lava Lava · $250 Andres</div>
      <div class="footer-sub">Flights ($7,123) & hotels covered by points · 35% rebates pending · FHR perks at Mauna Lani · Includes snorkel ($1,228) + luau ($1,443)</div>
    </div>
    <div class="reset-section">
      <button class="reset-btn" onclick="resetAll()">Reset All Data</button>
    </div>
  `;
  saveState(state);
  // Sound toggle button (fixed position, persists across renders)
  if (!document.getElementById('sound-btn')) {
    const btn = document.createElement('button');
    btn.id = 'sound-btn'; btn.className = 'sound-toggle';
    btn.textContent = '🔔'; btn.title = 'Toggle activity alarms';
    btn.onclick = toggleSound;
    document.body.appendChild(btn);
  }
}

function renderDay(d, di) {
  const isOpen = state.openDay === di;
  const doneCount = d.items.filter(i => i.done).length;
  const progress = d.items.length > 0 ? (doneCount / d.items.length) * 100 : 0;
  const addonsHtml = (d.addons && d.addons.length > 0) ? `
    <div class="addons-box">
      <div class="addons-title">Optional Add-ons</div>
      ${d.addons.map(a => `<div class="addon-item">+ ${a}</div>`).join('')}
    </div>
  ` : '';
  return `
    <div class="day-card ${isOpen ? 'open' : ''}">
      <div class="day-header" onclick="toggleDay(${di})">
        <span class="day-icon">${d.icon}</span>
        <div class="day-info">
          <div class="day-meta">Day ${d.day} · ${d.date} · ${d.location}</div>
          <div class="day-title">${d.title}</div>
        </div>
        <span class="day-badge">${d.vibe}</span>
        <div class="day-progress"><div class="day-progress-fill" style="width:${progress}%"></div></div>
        <span class="day-arrow">▾</span>
      </div>
      ${isOpen ? `
        <div class="day-content">
          <div class="day-divider"></div>
          ${d.items.map((item, ii) => renderActivity(item, di, ii)).join('')}
          <div class="add-activity-row">
            <input class="add-time-input" id="add-time-${di}" placeholder="Time" />
            <input class="add-input" id="add-label-${di}" placeholder="Add an activity..." onkeydown="if(event.key==='Enter')addActivity(${di})" />
            <select class="add-select" id="add-type-${di}">
              <option value="activity">Activity</option>
              <option value="food">Food</option>
              <option value="beach">Beach</option>
              <option value="transport">Transport</option>
              <option value="hotel">Lodging</option>
            </select>
            <button class="add-btn" onclick="addActivity(${di})">Add</button>
          </div>
          <div class="tip-box">
            <div class="tip-title">Insider Tip</div>
            <div class="tip-text">${d.tip}</div>
          </div>
          ${addonsHtml}
          <div class="day-notes">
            <textarea class="notes-textarea" placeholder="Family notes for this day..."
              onchange="updateNotes(${di}, this.value)">${d.notes || ''}</textarea>
          </div>
          <div class="cash-estimate">Est. cash spend: ${d.cash}</div>
        </div>
      ` : ''}
    </div>
  `;
}

function renderBookingDetails(details) {
  return details.map(d => {
    if (d.section) return `<div class="booking-detail-section">${d.section}</div>`;
    if (d.link)    return `<div class="booking-detail-row"><a href="${d.href}" target="_blank" class="booking-detail-link">${d.link}</a></div>`;
    if (d.warn)    return `<div class="booking-detail-warning">${d.warn}</div>`;
    if (d.note)    return `<div class="booking-detail-note">${d.note}</div>`;
    return `<div class="booking-detail-row"><span class="booking-detail-label">${d.row}:</span> ${d.val}</div>`;
  }).join('');
}

function toggleBookingDetails(id) {
  const card = document.getElementById(id);
  const btn  = document.getElementById('btn-' + id);
  if (!card) return;
  const isOpen = card.classList.toggle('open');
  if (btn) btn.classList.toggle('open', isOpen);
}

function renderActivity(item, di, ii) {
  const did = `bd-${di}-${ii}`;
  const bdHtml = item.bookingDetails ? `
    <button class="booking-details-toggle" id="btn-${did}" onclick="event.stopPropagation();toggleBookingDetails('${did}')">
      📋 Booking Details <span class="bd-arrow">▸</span>
    </button>
    <div class="booking-details-card" id="${did}">
      ${renderBookingDetails(item.bookingDetails)}
    </div>` : '';
  // Live timer badge (today's activities only, Hawaii time)
  let timerHtml = '';
  const nowMs = Date.now();
  if (nowMs >= TRIP_START_MS && nowMs <= TRIP_END_MS) {
    const dayIdx = getHawaiiDayIndex();
    if (di === dayIdx) {
      const ts = getTimerState(state.days[di].items, ii, getHawaiiMinutes(), dayIdx);
      if (ts) timerHtml = `<div class="timer-badge ${ts.cls}" id="timer-${di}-${ii}">${ts.dot?'<span class="timer-dot"></span>':''}${ts.label}</div>`;
    }
  }
  const travelHint = item.travelMin > 0 ? `<div class="travel-hint">🚗 ${item.travelMin} min drive</div>` : '';
  return `<div class="activity-item type-${item.type} ${item.done ? 'done' : ''}">
    <div class="activity-check ${item.done ? 'checked' : ''}" onclick="toggleActivity(${di},${ii})">
      ${item.done ? '✓' : ''}
    </div>
    <div class="activity-time">${item.time}</div>
    <div class="activity-label">${item.label}${bdHtml}${timerHtml}${travelHint}</div>
    <button class="activity-remove" onclick="removeActivity(${di},${ii})">✕</button>
  </div>`;
}

function toggleDay(di) { state.openDay = state.openDay === di ? -1 : di; render(); }
function toggleActivity(di, ii) {
  state.days[di].items[ii].done = !state.days[di].items[ii].done;
  render();
  showSaveToast(state.days[di].items[ii].done ? '✓ Marked complete' : '↩ Unmarked');
}

function addActivity(di) {
  const time = document.getElementById(`add-time-${di}`).value || '—';
  const label = document.getElementById(`add-label-${di}`).value.trim();
  const type = document.getElementById(`add-type-${di}`).value;
  if (!label) return;
  state.days[di].items.push({ time, label, type, done: false });
  render();
}

function removeActivity(di, ii) { state.days[di].items.splice(ii, 1); render(); }
function updateNotes(di, val) { state.days[di].notes = val; saveState(state); }
function toggleBooking(bi) { state.bookings[bi].booked = !state.bookings[bi].booked; render(); }

function resetAll() {
  if (confirm('Reset all data? This will clear all changes, notes, and checkmarks.')) {
    localStorage.removeItem('hawaii-trip-2026-v6');
    state = { days: DEFAULT_DAYS, bookings: DEFAULT_BOOKINGS, openDay: 0 };
    render();
  }
}


// ─── Save Toast ─────────────────────────────────────────────────────────────
function showSaveToast(msg) {
  let toast = document.getElementById('save-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'save-toast';
    toast.className = 'save-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg || '✓ Saved';
  toast.classList.add('show');
  clearTimeout(window._saveToastTimer);
  window._saveToastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ─── Weather Widget (Dynamic Skins + 7-Day) ────────────────────────────────────
async function fetchWeather() {
  const el = document.getElementById('weather-area');
  if (!el) return;

  // wttr.in code → emoji
  function wEmoji(code) {
    const c = parseInt(code);
    if (c === 113) return '☀️';
    if (c === 116) return '⛅';
    if ([119,122].includes(c)) return '☁️';
    if (c === 143) return '🌫️';
    if ([176,263,266,281,284,293,296,299].includes(c)) return '🌦️';
    if ([302,305,308,311,314,317,320,353,356,359,362,365,368,371,374,377].includes(c)) return '🌧️';
    if ([200,386,389,392,395].includes(c)) return '⛈️';
    return '🌤️';
  }
  // WMO code (Open-Meteo) → emoji
  function wmoEmoji(code) {
    const c = parseInt(code);
    if (c === 0) return '☀️';
    if ([1,2].includes(c)) return '⛅';
    if (c === 3) return '☁️';
    if ([45,48].includes(c)) return '🌫️';
    if ([51,53,55,56,57].includes(c)) return '🌦️';
    if ([61,63,65,66,67,80,81,82].includes(c)) return '🌧️';
    if ([71,73,75,77,85,86].includes(c)) return '❄️';
    if ([95,96,99].includes(c)) return '⛈️';
    return '🌤️';
  }
  function getSkin(code) {
    const c = parseInt(code);
    if (c === 113) return 'sunny';
    if (c === 116) return 'partlycloudy';
    if ([119,122].includes(c)) return 'cloudy';
    if ([200,386,389,392,395].includes(c)) return 'stormy';
    return 'rainy';
  }
  function genBgAnim(skin) {
    if (skin === 'sunny') {
      const rays = Array.from({length:10},(_,i) =>
        `<div class="sun-ray" style="transform:rotate(${i*36}deg);animation:rayRot ${10+i*0.6}s linear infinite ${i%2===0?'':'reverse'}"></div>`
      ).join('');
      return `<div class="sun-orb"></div>${rays}`;
    }
    if (skin === 'rainy' || skin === 'stormy') {
      const drops = Array.from({length:30},() => {
        const l=(Math.random()*110-5).toFixed(1),h=(10+Math.random()*18).toFixed(0),
              dur=(0.5+Math.random()*0.7).toFixed(2),del=(Math.random()*2).toFixed(2);
        return `<div class="rdrop" style="left:${l}%;height:${h}px;animation-duration:${dur}s;animation-delay:-${del}s"></div>`;
      }).join('');
      if (skin==='stormy') {
        const bolts=[35,62,78].map((lp,i)=>`<div class="lbolt" style="left:${lp}%;top:${8+i*6}%;height:${55+i*12}px;animation-delay:${i*1.4}s"></div>`).join('');
        return drops+bolts;
      }
      return drops;
    }
    if (skin==='partlycloudy') {
      return [1,2,3].map(i=>{
        const w=80+i*40,h=(w*0.55).toFixed(0),top=10+i*20,dur=18+i*8,del=i*4;
        return `<div class="cpuff" style="width:${w}px;height:${h}px;top:${top}%;animation-duration:${dur}s;animation-delay:-${del}s"></div>`;
      }).join('');
    }
    return '';
  }
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function dayShort(dateStr) {
    const [y,m,d]=dateStr.split('-').map(Number);
    return DAYS[new Date(y,m-1,d).getDay()];
  }

  try {
    // Fetch current conditions (wttr.in) + 7-day forecast (Open-Meteo) in parallel
    const [wttrRes, omRes] = await Promise.all([
      fetch('https://wttr.in/Kona,Hawaii?format=j1'),
      fetch('https://api.open-meteo.com/v1/forecast?latitude=19.639&longitude=-155.996&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=Pacific%2FHonolulu&forecast_days=7')
    ]);
    if (!wttrRes.ok) throw new Error('wttr ' + wttrRes.status);
    const wttr = await wttrRes.json();
    const cur = wttr.current_condition[0];
    const today = wttr.weather[0];
    const skin = getSkin(cur.weatherCode);
    const bgAnim = genBgAnim(skin);
    const timeStr = new Date().toLocaleTimeString('en-US',{timeZone:'Pacific/Honolulu',hour:'numeric',minute:'2-digit'});

    // 7-day strip from Open-Meteo
    let weekHtml = '';
    if (omRes.ok) {
      const om = await omRes.json();
      const {time, weathercode, temperature_2m_max, temperature_2m_min, precipitation_probability_max} = om.daily;
      weekHtml = `
      <div class="weather-week-label">7-DAY FORECAST · KONA</div>
      <div class="weather-week">
        ${time.map((date,i) => {
          const label = i===0 ? 'Today' : (i===1 ? 'Tmrw' : dayShort(date));
          const pop = precipitation_probability_max[i];
          const popHtml = pop > 20 ? `<div class="wday-pop">💧${pop}%</div>` : '';
          return `<div class="weather-day-card ${i===0?'wday-today':''}">
            <div class="wday-label">${label}</div>
            <div class="wday-icon">${wmoEmoji(weathercode[i])}</div>
            <div class="wday-hi">${Math.round(temperature_2m_max[i])}°</div>
            <div class="wday-lo">${Math.round(temperature_2m_min[i])}°</div>
            ${popHtml}
          </div>`;
        }).join('')}
      </div>`;
    }

    el.innerHTML = `
    <div class="weather-section ws-${skin}">
      <div class="wbg">${bgAnim}</div>
      <div class="wcontent">
        <div class="weather-title">🌴 Kona Weather — Live</div>
        <div class="weather-row">
          <div class="weather-current">
            <span class="weather-icon">${wEmoji(cur.weatherCode)}</span>
            <span class="weather-temp">${cur.temp_F}°</span>
            <div class="weather-desc-block">
              <span class="weather-desc">${cur.weatherDesc[0].value}</span>
              <span class="weather-feels">Feels ${cur.FeelsLikeF}°F · H ${today.maxtempF}° / L ${today.mintempF}°</span>
            </div>
          </div>
          <div class="weather-details">
            <span>💧 ${cur.humidity}%</span>
            <span>💨 ${cur.windspeedMiles}mph ${cur.winddir16Point}</span>
            <span>☀️ UV ${cur.uvIndex}</span>
            <span>🌅 ${today.astronomy[0].sunrise}</span>
            <span>🌇 ${today.astronomy[0].sunset}</span>
          </div>
        </div>
        ${weekHtml}
        <div class="weather-updated">🕐 ${timeStr} HST · Kona International Airport</div>
      </div>
    </div>`;
  } catch(e) {
    el.innerHTML = `<div class="weather-section ws-cloudy"><div class="wcontent"><div class="weather-title">🌴 Kona Weather</div><div class="weather-loading">Could not load — <a href="https://wttr.in/Kona,Hawaii" target="_blank">check here</a></div></div></div>`;
  }
}

// Fish spawner
(function spawnFish() {
  var layer = document.createElement('div');
  layer.className = 'fish-layer';
  document.body.insertBefore(layer, document.body.firstChild);
  var pool = ['🐠','🐡','🐟','🦈','🐬','🐙','🦑','🐠','🐡','🐟'];
  pool.forEach(function(e,i) {
    var el = document.createElement('span');
    var goRight = i % 2 === 0;
    el.className = 'fish' + (goRight ? '' : ' rl');
    el.textContent = e;
    // Flip emoji direction for right-to-left swimmers
    if (!goRight) el.style.transform = 'scaleX(-1)';
    var sz = Math.round(15 + Math.random()*14);
    var top = (4 + Math.random()*90).toFixed(1);
    var dur = (20 + Math.random()*25).toFixed(1);
    var delay = -(Math.random()*35).toFixed(1);
    el.style.cssText = 'font-size:'+sz+'px;top:'+top+'%;animation-duration:'+dur+'s;animation-delay:'+delay+'s;';
    if (!goRight) el.style.cssText += 'transform:scaleX(-1);';
    layer.appendChild(el);
  });
})();

render();
fetchWeather();
setInterval(fetchWeather, 600000); // refresh weather every 10 min
</script>
